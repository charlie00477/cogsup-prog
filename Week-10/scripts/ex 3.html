<!DOCTYPE html>
<html>
  <head>
    <title>My experiment</title>
    <script src="https://unpkg.com/jspsych@8.0.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.0.0"></script>
    <link href="https://unpkg.com/jspsych@8.0.2/css/jspsych.css" rel="stylesheet" type="text/css" />
  </head>
  <body></body>
  <script type="text/javascript">
    const NUMBER_OF_TRIALS_PER_KEY = 3;
    const KEYS = ['R', 'B'];
    const STIM = [
    { word: "red", color: "red" },    
    { word: "blue", color: "blue" },  
    { word: "red", color: "blue" },    
    { word: "blue", color: "red" }     
  ];
    const BLANK_DURATION = 50 // ms;

    function createShuffledListOfTrials(stim, trialsPerKey){
      let possibleTrials = [];

      for (let k = 0; k < stim.length; k += 1){
        possibleTrials.push({
          type: jsPsychHtmlKeyboardResponse,
          stimulus: `<p style="font-size:60px; color:${stim[k].color};">${stim[k].word}</p>`,
          choices: KEYS
        });
      }

      return jsPsych.randomization.repeat(possibleTrials, trialsPerKey);
    }
  </script>
  <script type="text/javascript">
    const jsPsych = initJsPsych({
      on_finish: function(){
        jsPsych.data.get().localSave("csv", "demo_jspsych_results.csv");
        document.body.innerHTML = "Thank you!";
      }
    });

    const helloTrial = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `
        <p>Hello!</p>
        <p>You will be taking part in a toy experiment.
          You will see words displayed on the screen, push (${KEYS[0]} if the word is red or ${KEYS[1]} if the world is blue).</p>
        <p> 
          <b>Please answer as fast as you can!</b></p>
        <p>Press any key to continue.</p>
        `
    };

    const blankTrial = {
      type:jsPsychHtmlKeyboardResponse,
      stimulus: "",
      trial_duration: BLANK_DURATION,
      choices: [],
    };

    let trials = createShuffledListOfTrials(STIM, NUMBER_OF_TRIALS_PER_KEY);

    let timeline = [helloTrial];

    for (let trial of trials){
      timeline.push(trial);
      timeline.push(blankTrial)
    }

    jsPsych.run(timeline);
  </script>
</html>
